name: Roamcroft doğrulama
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Üretim HTTP ve CSP doğrulaması
        shell: bash
        run: |
          npm run start -- --port 3107 > /tmp/roamcroft-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3107/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:http -- http://127.0.0.1:3107
