name: Roamcroft doğrulama
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Üretim HTTP, dört WebSocket, gecikme ve kurtarma doğrulaması
        timeout-minutes: 5
        run: node scripts/check-runtime.mjs
